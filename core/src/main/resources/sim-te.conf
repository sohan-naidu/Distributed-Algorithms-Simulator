simulator {
  outputDirectory = ${user.dir}/"output/"
  generator {
    jarPath = ${user.dir}/"core/generator/target/scala-3.2.2/netmodelsim.jar"
    minimumMemory = 2
    maximumMemory = 4
    ngsConfigPath = ${user.dir}/"core/src/main/resources/gen-random-graph.conf"
    outputFileName = "generated"
  }
  enricher {
    gen-output-file-path = ${simulator.outputDirectory}/"generated"/${simulator.generator.outputFileName}".ngs"
    topology = "tree"
    messages = ["Election", "Ping", "Pong", "Work", "Ack"]
    nodes {
      distribution {
        type = "Uniform"
      }
      seed = 42
      default-pdf = {"Ping": 0.3, "Work": 0.7}
      overrides = [
        {id = 3, is-input = true},
        {id = 7, tick-interval-ms = 5000},
        {id = 2, tick-interval-ms = 10000},
        {id = 5, is-input = true},
        {id = 10, is-input = true}
      ]
    }
    edges {
      default-allowed-messages = ${simulator.enricher.messages}
      overrides = [
        //        {from: 3, to: 4, allow=["Work"]},
        //        {from: 7, to: 9, allow=[]},
        //        {from: 10, to: 2, allow=["Work"]}
      ]
    }
    enriched-output-file-path = ${simulator.outputDirectory}"enriched/enriched.sim"
  }
  translator {
    enriched-output-file-path = ${simulator.enricher.enriched-output-file-path},
    inject-file-path = ${user.dir}/"input/input.json"
  }
}

cinnamon.chmetrics {
  reporters = ["slf4j-reporter"]

  slf4j-reporter {
    output-to = "cinnamon.metrics"
    frequency = 5s
  }
}

cinnamon.akka {
  actors {
    "/user/*" {
      report-by = instance
    }
  }
}